# The site (site/), built by Astro and published to GitHub Pages at
# https://agentplot.github.io/tailrace. Once, by hand, the repository's
# Pages source must be set to "GitHub Actions" (Settings → Pages → Build and
# deployment → Source); after that every push to main that touches the site
# deploys.
name: pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - README.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The bun of the devenv shell, which wrote bun.lock.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        working-directory: site
      - run: bun run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
