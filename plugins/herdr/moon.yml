$schema: 'https://moonrepo.dev/schemas/project.json'

# The herdr plugin: POSIX sh scripts, with jq programs.
language: 'bash'
layer: 'application'

tasks:
  # herdr-plugin.toml as herdr will read it.
  manifest:
    command: 'sh tests/manifest.sh'
    inputs: ['herdr-plugin.toml', 'bin/**/*', 'tests/manifest.sh', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
  # The scripts against stand-in curl, tailrace, herdr and git, under the
  # system's sh.
  test-sh:
    command: 'sh tests/run.sh'
    inputs: ['herdr-plugin.toml', 'bin/**/*', 'lib/**/*', 'tests/**/*', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
  # The same under dash, which the shell pins.
  test-dash:
    command: 'sh tests/dash.sh'
    inputs: ['herdr-plugin.toml', 'bin/**/*', 'lib/**/*', 'tests/**/*', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
  # Two panes against a real tailrace serve at the core's address, by
  # hand with `moon run plugin-herdr:host`: serve binds the host's own
  # port, so this is in no gate, and it refuses to run where anything
  # answers there. It builds tailrace, so it never replays.
  host:
    command: 'sh tests/host.sh'
    tags: [check-host]
    options: {cache: false}
