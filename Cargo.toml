[workspace]
resolver = "2"
members = [
  "crates/tailrace-seams",
  "crates/tailrace-core",
  "crates/tailrace-fakes",
  "crates/tailrace-conformance",
  "crates/tailrace",
]

[workspace.package]
# The released version is the tag's, given to the flake as TAILRACE_VERSION
# and never to the binary: a binary names the revision it was built from
# and the build that made it (statement 24, C.11).
version = "0.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
aws-config = { version = "1.13", default-features = false, features = [
  "rt-tokio",
  "behavior-version-latest",
  "sso",
  "credentials-process",
] }
aws-credential-types = "1.3"
aws-sdk-kms = { version = "1.126", default-features = false, features = [
  "rt-tokio",
  "behavior-version-latest",
] }
aws-smithy-http-client = { version = "1.5", features = ["rustls-ring"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
docker_credential = "1.4"
git-cliff-core = { version = "2.14", default-features = false, features = [
  "repo",
] }
git2 = { version = "0.21", default-features = false }
glob = "0.3"
http = "1"
libc = "0.2"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ssh-key = { version = "0.6", features = ["ed25519", "getrandom"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "time"] }
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
# A refusal or an unreadable answer carries what its clause names and the
# source's own words verbatim (59), so it is as large as they are.
result_large_err = "allow"
