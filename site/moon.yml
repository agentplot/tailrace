$schema: 'https://moonrepo.dev/schemas/project.json'

# The site, published to https://agentplot.github.io/timber by
# .github/workflows/pages.yml. bun comes from the devenv shell, bun's own
# release build (devenv.nix).
language: 'typescript'
layer: 'application'

tasks:
  # bun is the version the Pages workflow pins, on whichever host runs the
  # gate (core.26). It reads the tool it checks from outside the tree, so
  # it never replays.
  toolchain:
    command: 'sh check-toolchain.sh'
    tags: [check-fast]
    options: {cache: false}
  # The pinned dependencies, from bun.lock. It reaches the registry, so it
  # is never replayed.
  install:
    command: 'bun install --frozen-lockfile'
    inputs: ['package.json', 'bun.lock']
    options: {cache: false}
  build:
    command: 'bun run build'
    deps: ['~:install']
    inputs: ['src/**/*', 'public/**/*', 'astro.config.mjs', 'package.json', 'bun.lock', 'tsconfig.json', '/devenv.nix', '/devenv.lock', '/.prototools']
    outputs: ['dist']
    tags: [check-fast]
