# moon runs tailrace's checks: one project per crate, for the site and for
# each plugin directory, each holding its own checks (core.25); the root
# holds what spans the tree.
# Each check is tagged with its layer, which a branch's policy requires by
# tag:
#   check-fast    the cargo tests over the fakes, format, lint, the site's
#                 build, the plugins' hooks and manifests: under a minute
#   check-tools   the profiles' tests against moon, sluice and OpenSSH in
#                 scratch repositories, the tools the devenv shell pins
#   check-host    the herdr pane against a real tailrace serve at the
#                 core's address, the host's own port: by hand, in no gate
# The cargo tests are also tagged `cargo-test`. A task whose inputs are
# identical to a run that passed on this host, in any worktree, replays
# from .moon/cache/outputs (a link into the git common dir, made by
# devenv.nix), so every task's inputs name everything it reads.
$schema: 'https://moonrepo.dev/schemas/workspace.json'

projects:
  seams: 'crates/tailrace-seams'
  core: 'crates/tailrace-core'
  fakes: 'crates/tailrace-fakes'
  conformance: 'crates/tailrace-conformance'
  cli: 'crates/tailrace'
  site: 'site'
  plugin-claude-code: 'plugins/claude-code'
  plugin-herdr: 'plugins/herdr'
  root: '.'

# --affected compares against the merge-base with main.
vcs:
  client: 'git'
  defaultBranch: 'main'

telemetry: false
