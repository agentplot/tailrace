$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'rust'
dependsOn: [seams]

tasks:
  test:
    command: 'cargo test -p tailrace-core'
    inputs: ['/crates/tailrace-core/**/*', '/crates/tailrace-seams/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock']
    tags: [cargo-test, check-fast]
    options: {runFromWorkspaceRoot: true}
