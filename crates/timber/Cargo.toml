[package]
name = "timber"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Build once, sign everything, promote with proof, in your own account."
build = "build.rs"

[[bin]]
name = "timber"
path = "src/main.rs"

[dependencies]
timber-seams = { path = "../timber-seams" }
timber-core = { path = "../timber-core" }
anyhow.workspace = true
aws-config.workspace = true
aws-sdk-kms.workspace = true
aws-smithy-http-client.workspace = true
base64.workspace = true
clap.workspace = true
docker_credential.workspace = true
flate2.workspace = true
glob.workspace = true
libc.workspace = true
nodejs-semver.workspace = true
p256.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
ssh-key.workspace = true
tar.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
ureq.workspace = true
toml_edit.workspace = true
semver.workspace = true

# The tests that run moon, sluice or ssh-keygen against a scratch
# repository: the tools layer (`check-tools`), which `cargo test` without
# the feature compiles to nothing.
[features]
tools = []

[dev-dependencies]
timber-fakes = { path = "../timber-fakes" }
timber-conformance = { path = "../timber-conformance" }
aws-credential-types.workspace = true
aws-smithy-http-client = { workspace = true, features = ["test-util"] }
http.workspace = true
tempfile.workspace = true

[lib]
doctest = false

[lints]
workspace = true
