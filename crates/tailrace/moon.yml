$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'rust'
dependsOn: [seams, core, fakes, conformance]

tasks:
  test:
    command: 'cargo test -p tailrace'
    inputs: ['/crates/tailrace/**/*', '/crates/tailrace-seams/**/*', '/crates/tailrace-core/**/*', '/crates/tailrace-fakes/**/*', '/crates/tailrace-conformance/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock']
    tags: [cargo-test, check-fast]
    options: {runFromWorkspaceRoot: true}
  # The profiles' tests that run moon, sluice and ssh-keygen against
  # scratch repositories, and the registry store's against a zot and a
  # reference distribution each started for the test, behind the `tools`
  # feature: the tools layer.
  tools:
    command: 'cargo test -p tailrace --features tools --test build_moon --test landing_sluice --test landings_end_to_end --test laptop --test moon_cache --test registry_store --test push_after_landing'
    inputs: ['/crates/tailrace/**/*', '/crates/tailrace-seams/**/*', '/crates/tailrace-core/**/*', '/crates/tailrace-fakes/**/*', '/crates/tailrace-conformance/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools']
    tags: [check-tools]
    options: {runFromWorkspaceRoot: true}
  # The registry store's group and the cache manifest's scenarios against
  # the ECR repository the host names in devenv.local.nix
  # (env.TAILRACE_TOOLS_ECR), behind the `tools` feature; it refuses to
  # run, naming the setting, on a host that names none. It needs a
  # person's live AWS session, so it runs outside the gate under a tag of
  # its own, by hand with `moon run ':#check-ecr'` and a live session, or
  # by a job that holds an identity of its own (core.38).
  tools-ecr:
    command: 'cargo test -p tailrace --features tools --test registry_ecr'
    inputs: ['/crates/tailrace/**/*', '/crates/tailrace-seams/**/*', '/crates/tailrace-core/**/*', '/crates/tailrace-fakes/**/*', '/crates/tailrace-conformance/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '$TAILRACE_TOOLS_ECR']
    tags: [check-ecr]
    options: {runFromWorkspaceRoot: true}
  # The key service signer's group against the KMS keys the host names in
  # devenv.local.nix (env.TAILRACE_TOOLS_KMS_KEY, and
  # env.TAILRACE_TOOLS_KMS_STRANGER as the stranger), behind the `tools`
  # feature; it refuses to run, naming both settings, on a host that names
  # neither. It needs a person's live AWS session, so it runs outside the
  # gate under a tag of its own, by hand with `moon run ':#check-kms'` and a
  # live session, or by a job that holds an identity of its own (core.38).
  kms:
    command: 'cargo test -p tailrace --features tools --test kms_account'
    inputs: ['/crates/tailrace/**/*', '/crates/tailrace-seams/**/*', '/crates/tailrace-core/**/*', '/crates/tailrace-fakes/**/*', '/crates/tailrace-conformance/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '$TAILRACE_TOOLS_KMS_KEY', '$TAILRACE_TOOLS_KMS_STRANGER']
    tags: [check-kms]
    options: {runFromWorkspaceRoot: true}
