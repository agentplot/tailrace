$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'rust'
dependsOn: [seams, core, fakes, conformance]

tasks:
  test:
    command: 'cargo test -p tailrace'
    inputs: ['/crates/tailrace/**/*', '/crates/tailrace-seams/**/*', '/crates/tailrace-core/**/*', '/crates/tailrace-fakes/**/*', '/crates/tailrace-conformance/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock']
    tags: [cargo-test, check-fast]
    options: {runFromWorkspaceRoot: true}
  # The profiles' tests that run moon, sluice and ssh-keygen against
  # scratch repositories, behind the `tools` feature: the tools layer.
  tools:
    command: 'cargo test -p tailrace --features tools --test build_moon --test landing_sluice --test landings_end_to_end --test laptop'
    inputs: ['/crates/tailrace/**/*', '/crates/tailrace-seams/**/*', '/crates/tailrace-core/**/*', '/crates/tailrace-fakes/**/*', '/crates/tailrace-conformance/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools']
    tags: [check-tools]
    options: {runFromWorkspaceRoot: true}
