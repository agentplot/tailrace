[package]
name = "tailrace"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Build once, sign everything, promote with proof, in your own account."
build = "build.rs"

[[bin]]
name = "tailrace"
path = "src/main.rs"

[dependencies]
tailrace-seams = { path = "../tailrace-seams" }
tailrace-core = { path = "../tailrace-core" }
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
docker_credential.workspace = true
glob.workspace = true
serde.workspace = true
serde_json.workspace = true
ssh-key.workspace = true
toml.workspace = true
ureq.workspace = true

# The tests that run moon, sluice or ssh-keygen against a scratch
# repository: the tools layer (`check-tools`), which `cargo test` without
# the feature compiles to nothing.
[features]
tools = []

[dev-dependencies]
tailrace-fakes = { path = "../tailrace-fakes" }
tailrace-conformance = { path = "../tailrace-conformance" }
tempfile.workspace = true

[lib]
doctest = false

[lints]
workspace = true
