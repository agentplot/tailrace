schema: spec-driven

context: |
  tailrace delivers what the merge queue lands: it versions, packages,
  signs and pushes a build's outputs as OCI artifacts with attestations
  into a registry the owner controls. It is written in Rust, with a site
  in Astro.
  The design is the statement of invariants in agentplot/blueprints,
  design/tailrace/requirements.md (local:
  ~/Code/github_agentplot/blueprints/main/design/tailrace/requirements.md);
  the design book is https://agentplot.github.io/blueprints/tailrace/.
  An artifact that rests on a clause cites it by bare number, (71), and
  never restates it.

  Rules that bind every diff are docs/architecture/core.md (core.1 to
  core.37); decisions are docs/adr/ (MADR, numbered, adrs.toml). A change
  that departs from a rule says which and why; a clause that no longer
  holds is changed in the statement first, never worked around here
  (core.23).

  The words are the statement's vocabulary (its section 3): specs, design
  and code use its terms as it defines them and redefine none. Nothing
  commercial, no pricing, tier, hosted plan or customer, appears in this
  repository (core.24).

  Every cargo and moon command runs inside devenv shell. Commit by
  pathspec only: git add <paths>; git commit -m "<subject>" -- <paths>.
  Conventional Commits, scope the part of the tree touched. main is
  protected: work on a worktree branch and land with sluice submit main.

rules:
  proposal:
    - State what is out of scope and which later change it waits on
  specs:
    - Requirements use the statement's words; a scenario is checkable by the conformance suite or a crate's tests
  tasks:
    - Every task names its verification; site pages and ADRs land with the group that changes the behaviour they describe
    - A change that adds a language, a file type, a crate, a plugin directory or a directory under site/ has a task that puts it under treefmt, its linter and a check-fast moon task (core.25); a verification is a moon task the gate runs, or the task says why it can only be run by hand
    - A crate, a plugin directory and site/ are each a moon project of their own in .moon/workspace.yml, with its language declared and a task per check; none of its checks is a task of the root or another project (core.25)
